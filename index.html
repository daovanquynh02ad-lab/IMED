{id:141,m:0,q:"Углеводный обмен при «пожаре обмена» в очаге воспаления меняется следующим образом:",o:["Торможение анаэробного расщепления углеводов при наличии достаточного количества кислорода","Меняется в виде эффекта Пастера","Снижение утилизации тканями глюкозы, снижение процесса гликолиза","Повышение утилизации тканями глюкозы, интенсификация процесса гликолиза, приводящего к накоплению молочной кислоты"],c:[3]},
{id:142,m:0,q:"Жировой обмен при «пожаре обмена» в очаге воспаления меняется следующим образом:",o:["Преобладание расщепления липидов над их синтезом в крови, увеличение концентрации свободных жирных кислот, нарастание кетоновых тел","Преобладание синтеза липидов над их расщеплением, уменьшение концентрации свободных жирных кислот","Увеличение концентрации свободных жирных кислот за счет увеличения синтеза липидов в очаге воспаления, снижение продукции кетоновых тел","Уменьшение концентрации свободных жирных кислот за счет уменьшения синтеза липидов в очаге воспаления, нарастание кетоновых тел"],c:[0]},
{id:143,m:0,q:"Белковый обмен при «пожаре обмена» в очаге воспаления меняется следующим образом:",o:["Замедление расщепления белков в очаге воспаления, снижение количества аминокислот и полипептидов в крови","Усиление расщепления белков в очаге воспаления, накопление аминокислот и полипептидов в крови","Накопление аминокислот и полипептидов в крови за счет замедления расщепления белков в очаге воспаления"],c:[1]},
{id:144,m:0,q:"В каком из приведенных ниже ответов правильно описана последовательность процессов, инициирующих воспалительную реакцию?",o:["Гипоксия тканей – лабилизация лизосомальных мембран и выход ферментов лизосом – повреждающее воздействие лизосомальных ферментов на ткани – альтерация","Альтерация – гипоксия тканей – лабилизация лизосомных мембран и выход ферментов лизосом – повреждающее воздействие лизосомальных ферментов на ткани","Альтерация – гипоксия тканей – повреждающее воздействие лизосомальных ферментов на ткани – лабилизация лизосомальных мембран и выход ферментов лизосом","Альтерация – лабилизация лизосомальных мембран и выход ферментов лизосом – повреждающее воздействие лизосомальных ферментов на ткани – гипоксия тканей"],c:[1]},

{id:147,m:1,q:"Какие из перечисленных ниже биологически активных веществ способны в процессе развития воспалительной реакции вызвать расширение мелких сосудов, сокращение стенок мелких вен и образование пор в стенках мелких сосудов?",o:["Фактор Хагемана","Гистамин","Альфа-глобулины","Простагландины"],c:[1,3]},
{id:148,m:0,q:"В каком из приведённых ниже ответов правильно указана последовательность реакций, приводящая к образованию простагландинов в очаге воспаления?",o:["Арахидоновая кислота участвует в расщеплении мембран клеток, что в конечном итоге приводит к образованию простагландинов","Ферменты лизосом активируют арахидоновую кислоту, которая вместе с фосфолипидами мембран клеток образует простагландины","Ферменты лизосом расщепляют фосфолипиды мембран клеток, что приводит к высвобождению арахидоновой кислоты и далее образование простагландинов"],c:[2]},
{id:149,m:0,q:"Какую роль в развитии воспалительной реакции играет система комплемента?",o:["Способствует опсонизации, хемотаксису фагоцитов, обеспечивает лизис микробных клеток","Обеспечение дегрануляции тучных клеток","Содействие в образовании простагландинов","Активация кининовых систем крови"],c:[0]},
{id:150,m:0,q:"В каком из приводимых ниже ответов правильно указана динамика изменения кислотно-основного состояния в очаге воспаления?",o:["Длительный компенсированный метаболический ацидоз – некомпенсированный метаболический ацидоз – первичный ацидоз – артериальная гиперемия (нормализация КОС)","Первичный ацидоз – длительный компенсированный метаболический ацидоз – некомпенсированный метаболический ацидоз – артериальная гиперемия (нормализация КОС)","Артериальная гиперемия (нормализация КОС) – первичный ацидоз – длительный компенсированный метаболический ацидоз – некомпенсированный метаболический ацидоз","Первичный ацидоз – артериальная гиперемия (нормализация КОС) – длительный компенсированный метаболический ацидоз – некомпенсированный метаболический ацидоз"],c:[3]},
{id:151,m:1,q:"Почему длительный выраженный метаболический ацидоз сменяется некомпенсированным ацидозом?",o:["Накопление полипептидов приводит к повышению онкотического давления, что выражается в смещении рН в кислую сторону","При компенсированном ацидозе щелочные резервы тканей снижены, но их рН еще не меняется, затем по причине увеличения концентрации Н+ происходит сдвиг рН в кислую сторону","При компенсированном ацидозе щелочные резервы тканей снижены, но их рН еще не меняется, затем по причине истощения щелочных резервов идет сдвиг рН в кислую сторону","Повреждение клеток приводит к увеличению ОН-, и истощение кислых резервов смещает рН в щелочную сторону"],c:[1,2]},
{id:152,m:0,q:"Как изменяется осмотическое и онкотическое давление в процессе развития воспалительной реакции?",o:["Осмотическое и онкотическое давление тканей увеличивается, а в кровеносных сосудах уменьшается","Осмотическое и онкотическое давление тканей уменьшается, а в кровеносных сосудах увеличивается","В тканях уменьшается осмотическое давление, а в кровеносных сосудах увеличивается онкотическое давление","В тканях уменьшается онкотическое давление, а в кровеносных сосудах увеличивается осмотическое давление"],c:[0]},
{id:153,m:1,q:"За счет чего происходит увеличение осмотического давления в тканях при воспалении?",o:["За счет альтерации клеток происходит нарастание концентрации внеклеточного калия","Увеличение концентрации Н+ приводит к гипертонии в тканях","За счет альтерации клеток происходит нарастание концентрации внеклеточного кальция","Уменьшение концентрации Н+ приводит к гипертонии в тканях"],c:[0,1]},
{id:154,m:1,q:"Исходом повышения онкотического и осмотического давления в тканях при воспалении является?",o:["Постепенное снижение осмотического и онкотического давления","Повышение тургора тканей","Разрыв плазмолеммы и увеличение альтерации","Уменьшение зоны альтерации"],c:[1,2]},

{id:159,m:1,q:"Какие два важных свойства характерны для явления фагоцитоза?",o:["При фагоцитозе захватываются и элиминируются не только чужеродные частицы, но и те, которые могут стать таковыми при определенных условиях","Один и тот же агент не может быть патологическим для одной части организма и быть таковым для другой","При фагоцитозе захватываются не только чужеродные частицы, но и те, которые могут стать таковыми при определенных условиях","Один и тот же агент может быть патологическим для одной части организма и не быть таковым для другой"],c:[0,3]},

{id:161,m:1,q:"Первая стадия фагоцитоза характеризуется:",o:["Агрегацией лейкоцитов на эндотелиоците","Адгезией лейкоцитов к эндотелиоциту","Миграцией лейкоцитов в кровяное русло","Миграцией лейкоцитов через сосудистую стенку"],c:[1,3]},
{id:162,m:1,q:"Вторая стадия фагоцитоза характеризуется:",o:["Накоплением хемоаттрактантов в очаге воспаления","Изменением хемоаттрактантами свойств мембраны лейкоцитов","Источник энергии для передвижения лейкоцитов – гликолиз","Протоплазма лейкоцитов теряет способность превращаться из состояния геля в золь и обратно"],c:[0,1,2]},
{id:163,m:1,q:"За счет чего происходит прилипание фагоцита к фагоцитируемому объекту?",o:["Разных электрических зарядов фагоцита и объекта","Одинаковых электрических зарядов фагоцита и объекта","Усиление хемотаксиса","Ослабление хемотаксиса"],c:[0,2]},
{id:164,m:1,q:"Какие механизмы способствуют погружению фагоцита в объект?",o:["Одинаковые электрические заряды фагоцита и объекта","За счет образования фагоцитом псевдоподий","За счет инвагинации клеточной мембраны фагоцита","Изменение хемоаттрактантами свойств мембраны лейкоцитов"],c:[1,2]},
{id:165,m:1,q:"Какие дополнительные факторы способствуют погружению фагоцита в объект?",o:["Электрические заряды","Активность хемотаксиса","Величина поверхностного натяжения в месте соприкосновения фагоцита и фагоцитируемого объекта","Система комплемента"],c:[0,1,2,3]},
{id:166,m:1,q:"Какова функция опсонинов и бактериотропинов?",o:["Влияют на электрические заряды фагоцита и объекта","Уменьшают фагоцитирование микроорганизмов","Снижают поверхностное натяжение объекта фагоцитоза","Интенсификация фагоцитирования микроорганизмов"],c:[2,3]},
{id:167,m:1,q:"За счет каких механизмов реализуется переваривание в фагоците?",o:["Локализация объекта фагоцитоза в пищеварительной вакуоли","Умерщвление объекта фагоцитоза за счет быстрого смещения рН протоплазмы фагоцита в кислую сторону","Соединение пищеварительной вакуоли с несколькими лизосомами фагоцита","Образование фаголизосомы и переваривание объекта","Умерщвление объекта фагоцитоза за счет быстрого смещения рН протоплазмы фагоцита в щелочную сторону"],c:[0,1,2,3]},
{id:168,m:1,q:"В каких случаях наблюдается незавершенный фагоцитоз?",o:["Объект фагоцитоза имеет толстую полисахаридную капсулу, которая защищает их от кислой реакции среды","Объект фагоцитоза продуцирует вещества, препятствующие слиянию лизосом с пищеварительной вакуолью","Объект фагоцитоза слишком велик","Объектом фагоцитоза являются вирусы"],c:[0,1]},

{id:175,m:1,q:"Как передвигается лейкоцит к объекту фагоцитоза?",o:["Путем «переливания» превратившегося в золь жидкого кортикального геля из центральной части лейкоцита в переднюю (по принципу «выдавливания зубной пасты из тюбика»)","Под воздействием электростатических сил (притягивается к объекту фагоцитоза как к магниту)","Путем ориентации микротрубочек по направлению движения, всасывания в них превратившегося в золь кортикального геля с переднего полюса и выбрасывания его из трубочек в область заднего полюса (принцип движения ракеты)","Пассивно плывет в экссудате"],c:[0,2]},
{id:176,m:1,q:"Выберите положительные свойства механизма воспаления для организма:",o:["Альтерация в очаге воспаления «запускает» ряд защитно-приспособительных механизмов","Экссудация препятствует диссеминации патогенных возбудителей","Пролиферация восполняет возникшие при воспалении тканевые дефекты","Functio leasa переводит клетки и ткани в «щадящий» режим функционирования, что способствует выздоровлению"],c:[0,1,2,3]},
{id:177,m:0,q:"Что такое иммунитет?",o:["Способ защиты организма от воздействия патогенного температурного фактора","Способ защиты организма от патогенных смещений КОС","Способ защиты организма от живых тел и веществ, несущих признаки генетически чужеродной для него информации.","Способ защиты организма от повреждающих влияний нарушенного обмена веществ."],c:[2]},
{id:178,m:1,q:"Какие виды иммунитета вы знаете?",o:["Врожденный","Патологический","Приобретенный","Физиологический"],c:[0,2]},
{id:179,m:0,q:"Что такое врожденный иммунитет?",o:["Возникающий в результате вакцинации","Возникающий в результате введения иммунной сыворотки","Комплекс реакций, для формирования которых не требуется предварительный контакт иммунной системы с соответствующим антигеном","Возникающий после перенесенного какого-либо инфекционного заболевания"],c:[2]},
{id:180,m:1,q:"Какими факторами обеспечивается реализация механизмов врожденного иммунитета?",o:["Антитела матери, поступающие в организм плода через плаценту","Гранулоциты крови","Моноциты и макрофаги, интерфероны","Натуральные киллеры, лизоцим","Система комплемента, белки острой фазы"],c:[0,1,2,3,4]},
{id:181,m:1,q:"Приобретенный (адаптивный) иммунитет подразделяется на:",o:["Врожденный","Естественный","Приобретенный","Искусственный"],c:[1,3]},
{id:182,m:0,q:"В результате чего возникает естественный приобретенный иммунитет?",o:["Вакцинации","Введения иммунной сыворотки","Передачи в период внутриутробного развития антител от матери к плоду трансплацентарным путем","Перенесения какого-либо инфекционного заболевания"],c:[3]},
{id:183,m:0,q:"В результате чего возникает приобретенный искусственный активный иммунитет?",o:["Вакцинации","Введения иммунной сыворотки","Передачи в период внутриутробного развития антител от матери к плоду трансплацентарным путем","Перенесения какого-либо инфекционного заболевания"],c:[0]},
{id:184,m:0,q:"В результате чего возникает приобретенный искусственный пассивный иммунитет?",o:["Вакцинации","Введения иммунной сыворотки","Передачи в период внутриутробного развития антител от матери к плоду трансплацентарным путем","Перенесения какого-либо инфекционного заболевания"],c:[1]},
{id:185,m:1,q:"Что происходит в организме при введении иммунной сыворотки?",o:["Иммунная система не синтезирует антитела самостоятельно","Организм получает антитела в готовом виде, полученные при иммунизации животных","Организм получает ослабленные или убитые микроорганизмы, потерявшие вирулентность и патогенность, но сохранившие антигенные свойства","Организм получает ослабленный клон микроорганизмов, выращенный на питательной среде"],c:[0,1]},
{id:186,m:1,q:"На какие группы можно поделить механизмы иммунитета?",o:["Гуморальный","Активный","Приобретенный","Клеточный"],c:[0,3]},
{id:187,m:0,q:"Что подразумевают под гуморальным иммунитетом?",o:["Моноциты и макрофаги","Механизм фагоцитоза","Биосинтез антител плазматическими клетками, которые появляются в результате созревания В-лимфоцитов при контакте с антигеном","Система комплемента"],c:[2]},
{id:188,m:1,q:"Выберите все правильные утверждения, характерные для гуморального иммунитета:",o:["Антитела – белковые молекулы (гамма-глобулиновая фракция крови)","Основная функция антител – связывание антигенов","Иммунный комплекс образуется при связывании антигена с антителом","Антитела вырабатываются гранулоцитам крови","Основная функция антител – лизис антигена"],c:[0,1,2]},
{id:189,m:1,q:"За счет каких механизмов разрушается комплекс «антиген-антитело»?",o:["Разрушение с помощью фермента лизоцима","Фагоцитоз","Ликвидация с помощью натуральных киллеров","Лизис с участие белков системы комплемента"],c:[1,3]},
{id:190,m:0,q:"Прочность связывания антител с антигенами характеризуется таким свойством, как:",o:["Супрессия","Иммунологическая толерантность","Аффинность","Агрегация"],c:[2]},
{id:191,m:1,q:"Какие выделяют классы антител?",o:["IgM","IgG","IgA, IgE, IgD","IgF, IgI, IgY"],c:[0,1,2]},
{id:192,m:0,q:"Каковы особенности антител класса IgM?",o:["Выполняют регуляторную функцию в процессе взаимодействия В-лимфоцитов с антигеном","Первыми появляются в крови в ответ на внедрение в организм антигена при первичном иммунном ответе","Являются факторами местного иммунитета и защищают организм от антигенов еще до их проникновения во внутреннюю среду организма","Обладают способностью связываться с рецепторами на поверхности тучных клеток и вызывать их дегрануляцию при повторном контакте с аллергеном"],c:[1]},
{id:193,m:0,q:"Каковы особенности антител класса IgG?",o:["Являются факторами местного иммунитета и защищают организм от антигенов еще до их проникновения во внутреннюю среду организма","Обладают способностью связываться с рецепторами на поверхности тучных клеток и вызывать их дегрануляцию при повторном контакте с аллергеном","Данные антитела появляются после IgM при первичном иммунном ответе. При вторичном иммунном ответе их последовательность меняется.","Первыми появляются в крови в ответ на внедрение в организм антигена при первичном иммунном ответе"],c:[2]},
{id:194,m:0,q:"Каковы особенности антител класса IgA?",o:["Являются факторами местного иммунитета и защищают организм от антигенов еще до их проникновения во внутреннюю среду организма","Обладают способностью связываться с рецепторами на поверхности тучных клеток и вызывать их дегрануляцию при повторном контакте с аллергеном","Первыми появляются в крови в ответ на внедрение в организм антигена при первичном иммунном ответе","Данные антитела появляются после IgM при первичном иммунном ответе, при вторичном иммунном ответе их последовательность меняется"],c:[0]},
{id:195,m:0,q:"Каковы особенности антител класса IgE?",o:["Первыми появляются в крови в ответ на внедрение в организм антигена при первичном иммунном ответе","Данные антитела появляются после IgM при первичном иммунном ответе. При вторичном иммунном ответе их последовательность меняется.","Являются факторами местного иммунитета и защищают организм от антигенов еще до их проникновения во внутреннюю среду организма","Обладают способностью связываться с рецепторами на поверхности тучных клеток и вызывать их дегрануляцию при повторном контакте с аллергеном"],c:[3]},
{id:196,m:0,q:"Какова последовательность появления иммуноглобулинов при вторичном иммунном ответе?",o:["Сначала в крови появляются антитела IgG, а затем IgM","Сначала в крови появляются антитела IgM, а затем IgG","Сначала в крови появляются антитела IgA, а затем IgE","Сначала в крови появляются антитела IgM, а затем IgА"],c:[0]},
{id:197,m:1,q:"Какова функция и свойство Fc-фрагмента молекулы антитела?",o:["Этим фрагментом определяется специфичность антитела (комплиментарность к определенному антигену)","Обеспечивает взаимодействие иммунного комплекса с рецептором на поверхности фагоцита","Идентичны у всех антител","Отвечают за связывание с антигеном"],c:[1,2]},
{id:198,m:1,q:"Какова функция и свойство Fab-фрагментов молекулы антитела?",o:["Этими фрагментами определяется специфичность антитела (комплиментарность к определенному антигену)","Обеспечивает взаимодействие иммунного комплекса с рецептором на поверхности фагоцита","Идентичны у всех антител","Отвечают за связывание с антигеном"],c:[0,3]},
{id:199,m:1,q:"Какие из перечисленных положений входят в селекционно-клональную теорию образования антител?",o:["Антиген, попадая в организм, реагирует только с тем лимфоцитом, который несет соответствующее этому антигену антитело","Антитела вырабатываются в малых лимфоцитах","В организме в целом имеются антитела к любым антигенам","В результате многократного деления лимфоцита возникает клон идентичных клеток, которые начинают синтезировать антитела к данному антигену в больших количествах","Антитела синтезируются на основе матрицы, в роли которой выступает антиген, проникший в организм"],c:[0,1,2,3]},
{id:200,m:1,q:"Какими факторами представлены клеточные механизмы иммунной защиты?",o:["Антителами","Гранулоциты крови","Клетки кожи и слизистых оболочек","Моноциты и макрофаги","Лимфоциты"],c:[1,2,3,4]},
{id:201,m:1,q:"Каковы функции Т-лимфоцитов?",o:["Участвуют в образовании антител","Обеспечивают взаимодействие иммунного комплекса с рецептором на поверхности фагоцита","Отвечают за механизмы иммунологической памяти","Принимают участие в реализации реакции отторжения трансплантата, гиперчувствительность замедленного типа, противоопухолевый иммунитет"],c:[2,3]},
{id:202,m:0,q:"Каковы функции Т-киллеров?",o:["Ответственны за распознавание антигенов на поверхности клеток и уничтожение последних в том случае, если их антигены окажутся чужеродными для организма","Презентируют на своей поверхности CD4+-рецепторы, играют роль своего рода «посредников» в реализации как клеточных, так и гуморальный механизмов иммунитета. Способны выделять цитокины","Подавляют активность ряда механизмов иммунной защиты, поддерживая состояние иммунологической толерантности к собственным антигенам"],c:[0]},
{id:203,m:0,q:"Каковы функции Т-хелперов?",o:["Подавляют активность ряда механизмов иммунной защиты, поддерживая состояние иммунологической толерантности к собственным антигенам","Ответственны за распознавание антигенов на поверхности клеток и уничтожение последних в том случае, если их антигены окажутся чужеродными для организма","Презентируют на своей поверхности CD4+-рецепторы, играют роль своего рода «посредников» в реализации как клеточных, так и гуморальный механизмов иммунитета. Способны выделять цитокины"],c:[2]},
{id:204,m:0,q:"Каковы функции Т-супрессоров?",o:["Презентируют на своей поверхности CD4+-рецепторы, играют роль своего рода «посредников» в реализации как клеточных, так и гуморальный механизмов иммунитета. Способны выделять цитокины.","Подавляют активность ряда механизмов иммунной защиты, поддерживая состояние иммунологической толерантности к собственным антигенам","Ответственны за распознавание антигенов на поверхности клеток и уничтожение последних в том случае, если их антигены окажутся чужеродными для организма"],c:[1]},
{id:205,m:0,q:"Какие из ниже перечисленных клеток являются носителями иммунологической памяти?",o:["В-лимфоциты","Купферовские клетки печени","Стромальные клетки костного мозга","Т-лимфоциты"],c:[3]},
{id:206,m:1,q:"Какие перечисленные клетки участвуют в иммунной реакции отторжения трансплантата?",o:["В-лимфоциты","Купферовские клетки печени","Макрофаги","Стромальные клетки костного мозга","Т-лимфоциты"],c:[2,4]},
{id:207,m:0,q:"Что такое главный комплекс гистосовместимости?",o:["Семейство генов, которые кодируют одноименные белки, выступающие в качестве маркеров идентичности на наружной мембране клеток.","Это семейство Т-лимфоцитов, отвечающее на механизмы иммунологической памяти","Группа макрофагов, участвующая в реализации механизмов отторжения трансплантата","Определенный клон гранулоцитов, участвующий в механизмах реализации клеточного иммунитета"],c:[0]},
{id:208,m:1,q:"В каких механизмах иммунной защиты принимает участие МНС I класса?",o:["Противоопухолевый иммунитет","Отторжение трансплантата","Презентация антигена на поверхности макрофага Т-хелперу","Синтезирует ряд гуморальных факторов иммунной защиты: белки системы комплемента, цитокины, белки теплового шока"],c:[0,1]},
{id:209,m:0,q:"В каких механизмах иммунной защиты принимает участие МНС II класса?",o:["Отторжение трансплантата","Презентация антигена на поверхности макрофага Т-хелперу, опосредуя механизмы противоинфекционного иммунитета","Противоопухолевый иммунитет","Синтезирует ряд гуморальных факторов иммунной защиты: белки системы комплемента, цитокины, белки теплового шока"],c:[1]},
{id:210,m:0,q:"В каких механизмах иммунной защиты принимает участие МНС III класса?",o:["Противоопухолевый иммунитет","Отторжение трансплантата","Презентация антигена на поверхности макрофага Т-хелперу","Синтезирует ряд гуморальных факторов иммунной защиты: белки системы комплемента, цитокины, белки теплового шока"],c:[3]},
{id:211,m:1,q:"Каковы механизмы РХПТ (реакция «хозяин против трансплатата»)?",o:["«Вспрыскивание» Т-лимфоцитами хозяина протеолитических ферментов (гранзимов) в ткани трансплантата","Захват Т-лимфоцитами хозяина антигенов трансплантата с последующим разрушением Т-лимфоцитов и выходом их протеолитических ферментов в ткани хозяина","Плохая техника операции","Разрушающая роль антител, образовавшихся к антигенам трансплантата.","Встраивают в мембраны клеток трансплантата белки-перфорины"],c:[0,1,4]},
{id:212,m:1,q:"Каковы главные осложнения подавления РХТП (реакция «хозяин против трансплатата») иммунодепрессантами?",o:["Возникновение тяжелой анемии","Дистрофические процессы","Увеличение частоты возникновения злокачественных опухолей","Ускоренное старение","Частые инфекционные заболевания с тяжелым течением","Эндокринные расстройства"],c:[2,4]},
{id:213,m:0,q:"Почему увеличивается риск возникновения злокачественных опухолей при использовании цитостатиков для подавления реакции «хозяин против трансплантата»?",o:["Реакции отторжения трансплантата основаны, прежде всего, на клеточных механизмах, которые как раз и отвечают за противоопухолевых иммунитет","На фоне иммуносупрессии увеличивается восприимчивость к инфекциям грибковой природы","На фоне замедления деления нормальных клеток стимулируется рост злокачественных клеток","Цитостатики нарушают гуморальный иммунитет, что приводит к росту злокачественных клеток"],c:[0]},
{id:214,m:0,q:"Что такое иммунологическая толерантность?",o:["Семейство генов, которые кодируют одноименные белки, выступающие в качестве маркеров идентичности на наружной мембране клеток.","Дефекты иммунной системы, приводящие к нарушению защиты организма от воздействия антигенов","Состояние ареактивности иммунной системы по отношению к субстанциям, которые в обычных условиях вызывают развитие иммунологической реакции","Способ защиты организма от живых тел и веществ, несущих признаки генетически чужеродной для него информации"],c:[2]},
{id:215,m:1,q:"Каковы главные особенности развития состояния иммунологической толерантности?",o:["Антигенный фактор не играет роли в развитии толерантности","Толерантность вызывается антигеном","Толерантность обладает специфичностью","Иммунологическая специфичность для толерантности не характерна","Развитие идет по принципу «все или ничего»","Состояние толерантности во многом зависит от количества антигена, по отношению к которому она вызвана"],c:[1,2,5]},
{id:216,m:1,q:"Какие из ниже перечисленных факторов обусловливают развитие иммунологической толерантности?",o:["Возможность формирования пассивной иммунологической толерантности","Степень чужеродности антигена","Способность клеток, индуцирующих толерантность к активной регенерации","Количество антигена","Повторные введения антигена"],c:[0,1,2,3,4]},

function escapeHtml(t) { if(!t)return""; return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function processQuestions() {
    QUESTIONS_DATA = RAW_PATHOPHYS_QUESTIONS.map((q) => {
        const t = TOPIC_RANGES.find(r => q.id >= r.start && q.id <= r.end) || TOPIC_RANGES[0];
        const qText = escapeHtml(q.q);
        const oText = (q.o || []).map(o => escapeHtml(o));
        const cleanTopic = t ? t.title.replace(/^\s*\d+\s*[\.\)\-:]\s*/, '') : "";
        
        return { 
            id: q.id, 
            topic: t ? t.title : "Общее", 
            question: qText, 
            options: oText, 
            correctIndices: q.c, 
            image: null,
            searchString: (qText + ' ' + oText.join(' ') + ' ' + cleanTopic).toLowerCase()
        };
    });
    availableTopics = [...new Set(QUESTIONS_DATA.map(q => q.topic))];
    if (!state.selectedTopics || state.selectedTopics.length === 0) {
        state.selectedTopics = [...availableTopics];
    } else {
        state.selectedTopics = state.selectedTopics.filter(t => availableTopics.includes(t));
        const oldTopics = availableTopics.slice(0, 7);
        const hadAllOldSelected = oldTopics.every(t => state.selectedTopics.includes(t));
        if (hadAllOldSelected && state.selectedTopics.length === 7) {
            state.selectedTopics = [...availableTopics];
        }
        if (state.selectedTopics.length === 0) {
            state.selectedTopics = [...availableTopics];
        }
    }
}

function getTelegramUserId() {
    try {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
            return window.Telegram.WebApp.initDataUnsafe.user.id;
        }
    } catch (e) {}

    const parseUserFromStr = (str) => {
        try {
            if (!str) return null;
            const params = new URLSearchParams(str);
            const userStr = params.get('user');
            if (userStr) return JSON.parse(userStr).id;
            let tgWebAppData = params.get('tgWebAppData');
            if (tgWebAppData) {
                tgWebAppData = decodeURIComponent(tgWebAppData);
                const subParams = new URLSearchParams(tgWebAppData);
                const subUser = subParams.get('user');
                if (subUser) return JSON.parse(subUser).id;
            }
        } catch (e) {}
        return null;
    };

    try { if (tg && tg.initData) { const id = parseUserFromStr(tg.initData); if (id) return id; } } catch (e) {}
    try { let hash = window.location.hash; if (hash.startsWith('#')) hash = hash.substring(1); const idHash = parseUserFromStr(hash); if (idHash) return idHash; } catch (e) {}
    try { let search = window.location.search; if (search.startsWith('?')) search = search.substring(1); const idSearch = parseUserFromStr(search); if (idSearch) return idSearch; } catch (e) {}
    return null;
}

let accessCheckAttempts = 0;
async function performAccessCheck() {
    currentUserId = getTelegramUserId();

    if (!currentUserId && accessCheckAttempts < 10) {
        accessCheckAttempts++;
        setTimeout(performAccessCheck, 500);
        return;
    }

    if(window.location.protocol==='file:'){ 
        accessData={allowed:true, progress:{}};
        loadLocalFallback();
        processQuestions();
        checkStateTransition();
        return;
    }
    
    if(!currentUserId){ 
        accessError={type:'browser',msg:'Не удалось определить пользователя. Откройте приложение внутри Telegram.'};
        checkStateTransition();
        return;
    }
    
    const ck = `${STORAGE_PREFIX}access_${currentUserId}`; 
    const tgUser = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) || {};
    const uName = encodeURIComponent(tgUser.first_name || "Студент");
    const uHandle = encodeURIComponent(tgUser.username || "");

    try {
        const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),15000);
        const res=await fetch(`${GOOGLE_SCRIPT_URL}?userId=${currentUserId}&name=${uName}&username=${uHandle}`,{signal:ctrl.signal});
        const data=await res.json();
        
        if(data.allowed){ 
            accessData=data; 
            if (data.progress) state.userProgress = data.progress;
            else { const localP=localStorage.getItem(`${STORAGE_PREFIX}progress_${currentUserId}`); if(localP) state.userProgress=JSON.parse(localP); }
            
            if (data.selectedTopics) state.selectedTopics = data.selectedTopics;
            else { const localT=localStorage.getItem(`${STORAGE_PREFIX}topics_${currentUserId}`); if(localT) state.selectedTopics=JSON.parse(localT); }
            
            processQuestions();
            localStorage.setItem(ck,JSON.stringify(data)); 
            localStorage.setItem(`${STORAGE_PREFIX}progress_${currentUserId}`, JSON.stringify(state.userProgress));
            localStorage.setItem(`${STORAGE_PREFIX}topics_${currentUserId}`, JSON.stringify(state.selectedTopics));
        } else {
            localStorage.removeItem(ck);
            accessError={type:'denied', msg:'Для открытия доступа отправьте чек об оплате (499 ₽) прямо в чат бота.'};
        }
    } catch(e){ 
        const c = localStorage.getItem(ck);
        const localP = localStorage.getItem(`${STORAGE_PREFIX}progress_${currentUserId}`);
        const localT = localStorage.getItem(`${STORAGE_PREFIX}topics_${currentUserId}`);
        if(c){ 
            try{ 
                const p=JSON.parse(c); 
                if(p.allowed){ 
                    accessData=p; 
                    if (localP) state.userProgress = JSON.parse(localP);
                    if (localT) state.selectedTopics = JSON.parse(localT);
                    processQuestions(); 
                } 
            } catch(err){ localStorage.removeItem(ck); } 
        }
        if (!accessData) accessError={type:'network', msg:'Ошибка сети. Проверьте интернет.'}; 
    }
    
    if (!state.userProgress) state.userProgress = {};
    if (!state.selectedTopics) state.selectedTopics = [];
    checkStateTransition();
}

function loadLocalFallback() {
    currentUserId = getTelegramUserId() || 'local_user';
    try {
        const localP = localStorage.getItem(`${STORAGE_PREFIX}progress_${currentUserId}`);
        if (localP) state.userProgress = JSON.parse(localP);
        const localT = localStorage.getItem(`${STORAGE_PREFIX}topics_${currentUserId}`);
        if (localT) state.selectedTopics = JSON.parse(localT);
    } catch(e) {}
}

async function saveProgressToCloud() {
    const uid = currentUserId || 'local_user';
    try {
        localStorage.setItem(`${STORAGE_PREFIX}progress_${uid}`, JSON.stringify(state.userProgress));
        localStorage.setItem(`${STORAGE_PREFIX}topics_${uid}`, JSON.stringify(state.selectedTopics));
    } catch(e) {}

    if (!USE_AUTH || !currentUserId || !accessData || isSaving) return;
    isSaving = true;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ userId: currentUserId, progress: state.userProgress, selectedTopics: state.selectedTopics }),
            signal: controller.signal
        });
    } catch(e) { } finally { clearTimeout(timeoutId); isSaving = false; }
}

function checkStateTransition() {
    if(!videoFinished && !accessError) return; 
    const intro=document.getElementById('intro-layer'), auth=document.getElementById('auth-screen'), block=document.getElementById('block-screen'), app=document.getElementById('app');
    if (videoFinished && !accessData && !accessError) { if(intro) intro.style.display='none'; auth.classList.remove('hidden-force'); return; }
    if(accessError){ 
        if(intro) intro.style.display='none';

        let icon='alert-triangle', title='Ошибка', colorClass='text-rose-500', bgClass='bg-rose-100 dark:bg-rose-900/30';
        if(accessError.type==='denied'){icon='lock';title='Доступ закрыт';} else if(accessError.type==='browser'){icon='smartphone';title='Только в Telegram';}
        block.innerHTML=`<div class="flex flex-col items-center justify-center h-full animate-fade-in px-4"><div class="${bgClass} p-6 rounded-full mb-6"><i data-lucide="${icon}" class="w-16 h-16 ${colorClass}"></i></div><h1 class="text-3xl font-black text-slate-900 dark:text-white mb-4">${title}</h1><p class="text-slate-500 dark:text-slate-400 mb-8 max-w-sm font-medium leading-relaxed">${accessError.msg}</p>${accessError.type==='denied'?`<button onclick="try{window.Telegram.WebApp.close()}catch(e){}" class="w-full max-w-xs bg-black dark:bg-white text-white dark:text-black py-4 rounded-2xl font-bold text-center shadow-lg btn-click transition-transform active:scale-95 mb-3">🧾 Отправить чек в бота</button><a href="https://t.me/stewonly" class="w-full max-w-xs bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 py-3.5 rounded-2xl font-bold text-sm text-center btn-click">Написать @stewonly</a>`:`<button onclick="window.location.reload()" class="w-full max-w-xs bg-slate-900 dark:bg-white text-white dark:text-black py-4 rounded-2xl font-bold shadow-lg btn-click">Попробовать снова</button>`}</div>`;
        lucide.createIcons(); return; 
    }
    if(accessData){
        if(intro){ intro.style.transition='opacity 0.3s'; intro.style.opacity='0'; setTimeout(()=>{intro.style.display='none';auth.classList.add('hidden-force');app.classList.remove('hidden-force');initApp();},300); }

}

    saveProgressToCloud();
}
function toggleSelectAllTopics() {

    if(state.showFilterModal){updateTopicListUI('filter');updateSelectAllButtonUI('filter');} else render();

}

function toggleResetTopic(t) {

    else state.resetSelectedTopics.push(t); 
    updateTopicListUI('reset'); updateSelectAllButtonUI('reset');
}
function toggleSelectAllReset() { 
    haptic('medium'); if(state.resetSelectedTopics.length===availableTopics.length) state.resetSelectedTopics=[]; else state.resetSelectedTopics=[...availableTopics]; 
    updateTopicListUI('reset'); updateSelectAllButtonUI('reset'); 
}

function confirmReset() { if(!state.resetSelectedTopics.length) { haptic('error'); return; } haptic('warning'); state.showResetModal = false; state.showConfirmResetDialog = true; render(); }
function executeFinalReset() {
    haptic('success');
    const newProgress = {};
    const topicsToRemove = new Set(state.resetSelectedTopics);
    for (const [id, prog] of Object.entries(state.userProgress)) {
        const q = QUESTIONS_DATA.find(x => x.id == id);
        if (!q || topicsToRemove.has(q.topic)) continue; 
        newProgress[id] = prog;
    }
    state.userProgress = newProgress; 
    state.resetSelectedTopics = []; 
    state.showConfirmResetDialog = false; 
    state.resumeState = null; 
    saveProgressToCloud(); render();
}
function cancelReset() { state.showConfirmResetDialog = false; state.showResetModal = true; render(); setTimeout(() => { updateTopicListUI('reset'); updateSelectAllButtonUI('reset'); }, 0); }

function updateTopicListUI(mode) {
    const listId = mode === 'filter' ? 'topics-list' : 'reset-topics-list';
    const list = document.getElementById(listId); if(!list) return;
    const selectedArr = mode === 'filter' ? state.selectedTopics : state.resetSelectedTopics;

    const stats = {};
    if (mode === 'filter') {
        QUESTIONS_DATA.forEach(q => {
            if (!stats[q.topic]) stats[q.topic] = { total: 0, correct: 0 };
            stats[q.topic].total++;
            if (state.userProgress && state.userProgress[q.id]?.status === 'correct') stats[q.topic].correct++;
        });
    }

    list.querySelectorAll('button[data-topic]').forEach(btn => {
        const t = btn.getAttribute('data-topic');
        const sel = selectedArr.includes(t);
        const icon = btn.querySelector('.icon-area');
        
        let btnClass = "w-full text-left px-4 py-3 rounded-xl font-bold text-sm flex flex-col gap-1 group btn-click relative";
        let progressHtml = '';
        if (mode === 'filter' && stats[t]) {
            const { total, correct } = stats[t];
            const progress = total > 0 ? Math.round((correct / total) * 100) : 0;
            let barBg = sel ? 'bg-white/20 dark:bg-black/20' : 'bg-slate-200 dark:bg-slate-700';
            let fillBg = sel ? 'bg-emerald-400 dark:bg-emerald-600' : 'bg-emerald-500';
            let txtColor = sel ? 'text-white/60 dark:text-black/60' : 'text-slate-400';
            progressHtml = `<div class="w-full h-1.5 ${barBg} rounded-full mt-2 overflow-hidden"><div class="h-full ${fillBg} rounded-full" style="width: ${progress}%"></div></div><div class="text-[10px] ${txtColor} mt-1 flex justify-between"><span>Прогресс (${correct}/${total})</span><span>${progress}%</span></div>`;
        }

        if(sel) { btnClass += " bg-black text-white dark:bg-white dark:text-black border border-transparent"; if(icon) icon.innerHTML='<i data-lucide="check-circle" class="w-4 h-4 absolute top-3 right-3 text-emerald-400 dark:text-emerald-600"></i>'; } 
        else { btnClass += " bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 relative"; if(icon) icon.innerHTML=''; }
        btn.className = btnClass;
        const contentDiv = btn.querySelector('.topic-content');
        if(contentDiv) contentDiv.innerHTML = `<span class="block text-wrap leading-tight pr-6 mb-1">${t}</span> ${progressHtml}`;
    });
    
    if (mode === 'filter') updateSelectAllButtonUI('filter');
    
    const apply = document.getElementById(mode === 'filter' ? 'apply-btn' : 'confirm-reset-btn'); 
    if(apply) apply.innerText = mode === 'filter' ? `Применить (${selectedArr.length})` : `Сбросить (${selectedArr.length})`;
    lucide.createIcons();
}

function updateSelectAllButtonUI(mode) {
    const btn = document.getElementById(mode === 'filter' ? 'select-all-btn' : 'reset-select-all-btn'); if(!btn) return;
    const all = (mode === 'filter' ? state.selectedTopics : state.resetSelectedTopics).length === availableTopics.length;
    btn.innerHTML=`<span>${all?'Снять все':'Выбрать все'}</span><i data-lucide="${all?'trash-2':'layers'}" class="w-4 h-4"></i>`;
    lucide.createIcons();
}

function startMode(mode, resume=false) {
    haptic('medium');
    if(resume && (!state.playableQuestions || state.playableQuestions.length === 0)) resume = false;
    if(resume && state.resumeState?.mode===mode){ state.view=mode; render(); return; }
    
    let q;
    if (mode === 'mistakes') {
        q = QUESTIONS_DATA.filter(x => state.userProgress && state.userProgress[x.id]?.status === 'wrong');
    } else {
        q = QUESTIONS_DATA.filter(x => state.selectedTopics.includes(x.topic));
    }

    if (mode === 'quiz' || mode === 'cards') {
        const unsolved = q.filter(question => { const p = state.userProgress[question.id]; return !p || p.status !== 'correct'; });
        if (unsolved.length > 0) q = unsolved;
    }
    
    if(!q.length){ 
        if (mode === 'mistakes') {
            state.playableQuestions = [];
            state.view = 'mistakes';
            render();
            return;
        }
        alert("Выберите хотя бы одну тему в фильтре!"); 
        return; 
    }
    
    if (mode === 'learn') {
        state.searchQuery = '';
        state.filteredLearnQuestions = q;
        state.learnRenderLimit = 25;
        state.searchCurrentIndex = -1;
    }

    if((mode==='quiz'||mode==='cards') && state.isShuffleEnabled) q = [...q].sort(()=>Math.random()-0.5);
    state.playableQuestions = q;

    if (!state.userProgress) state.userProgress = {};
    state.currentQuestionIndex = 0; state.view = mode; state.quizFinished = false; state.sessionAnswers = {}; state.resumeState = null; 
    loadStateForIndex(state.currentQuestionIndex);
    render();
}

function resetQuestionState() { state.selectedOptions=[]; state.isAnswerChecked=false; state.lastResult=false; state.isFlipped=false; state.swipeX=0; state.animState='idle'; }
function saveCurrentState() { state.sessionAnswers[state.currentQuestionIndex] = { selectedOptions: [...state.selectedOptions], isAnswerChecked: state.isAnswerChecked, lastResult: state.lastResult }; }
function loadStateForIndex(i) {
    const q = state.playableQuestions[i]; if (!q) return resetQuestionState();
    if (state.sessionAnswers[i]) { const s = state.sessionAnswers[i]; state.selectedOptions = s.selectedOptions; state.isAnswerChecked = s.isAnswerChecked; state.lastResult = (s.lastResult); return; }
    if (['quiz', 'cards', 'mistakes'].includes(state.view)) { resetQuestionState(); return; }
    const history = state.userProgress && state.userProgress[q.id];
    if (history && history.selected) { state.selectedOptions = history.selected; state.isAnswerChecked = true; state.lastResult = (history.status === 'correct'); } else { resetQuestionState(); }
}

function handleOptionSelect(idx) {
    if(state.isAnswerChecked) return; haptic('light');
    if(state.selectedOptions.includes(idx)) state.selectedOptions=state.selectedOptions.filter(x=>x!==idx); else state.selectedOptions.push(idx);
    render();
}
function checkAnswer() {
    if(!state.selectedOptions.length) return;
    state.isAnswerChecked=true; const q=state.playableQuestions[state.currentQuestionIndex];
    const sel=[...state.selectedOptions].sort((a,b)=>a-b).toString(), corr=[...q.correctIndices].sort((a,b)=>a-b).toString();
    state.lastResult=(sel===corr); haptic(state.lastResult?'success':'error');
    if(!state.userProgress) state.userProgress = {};
    state.userProgress[q.id]={ status: state.lastResult?'correct':'wrong', attempts: (state.userProgress[q.id]?.attempts||0)+1, selected: [...state.selectedOptions] };
    saveCurrentState(); saveProgressToCloud(); render();
}
function nextQuestion() {
    haptic('light'); saveCurrentState();
    if(state.currentQuestionIndex<state.playableQuestions.length-1) { state.currentQuestionIndex++; loadStateForIndex(state.currentQuestionIndex); document.querySelector('.layout-content').scrollTop=0; }
    else state.quizFinished=true;
    render();
}
function prevQuestion() {
    haptic('light'); saveCurrentState();
    if(state.currentQuestionIndex>0) { state.currentQuestionIndex--; loadStateForIndex(state.currentQuestionIndex); }
    render();
}
function goHome() {
    haptic('medium'); saveProgressToCloud();
    if(['quiz','cards','mistakes'].includes(state.view) && !state.quizFinished && state.playableQuestions.length) state.resumeState={mode:state.view, index:state.currentQuestionIndex, questions:state.playableQuestions};
    else state.resumeState=null;
    state.view='menu'; render();
}

function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); 
}

function updateSearchUI() {
    const controls = document.getElementById('search-controls');
    if (!controls) return;
    if (state.searchQuery && state.searchQuery.trim().length > 0) controls.classList.add('visible');
    else controls.classList.remove('visible');
}

function handleSearchInput(val) {
    state.searchQuery = val;
    updateSearchUI();
    
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
        state.learnRenderLimit = 25;
        state.searchCurrentIndex = -1;
        
        const trimmed = val.trim().toLowerCase();
        
        if (!trimmed) {
            state.filteredLearnQuestions = state.playableQuestions;
        } else {
            const words = trimmed.split(/\s+/).filter(w => w.length > 0);
            state.filteredLearnQuestions = state.playableQuestions.filter(q => {
                return words.every(w => q.searchString.includes(w) || String(q.id) === w);
            });
        }
        renderLearnList();
    }, 200);
}

function clearSearch() {
    haptic('light');
    const input = document.getElementById('learn-search-input');
    if(input) { input.value = ''; input.focus(); }
    handleSearchInput('');
}

function toggleAnswersVisibility() {
    haptic('light');
    state.hideAnswersInLearn = !state.hideAnswersInLearn;
    render();
}

function navigateSearch(direction) {
    haptic('light');
    document.activeElement?.blur(); 
    
    if (state.filteredLearnQuestions.length === 0) return;
    
    if(state.searchCurrentIndex >= 0) {
        const prevId = `learn-q-${state.filteredLearnQuestions[state.searchCurrentIndex]?.id}`;
        const prevEl = document.getElementById(prevId);
        if(prevEl) prevEl.classList.remove('active-search-result');
    }

    if (direction === 'next') {
        if (state.searchCurrentIndex < state.filteredLearnQuestions.length - 1) state.searchCurrentIndex++;
    } else {
        if (state.searchCurrentIndex > 0) state.searchCurrentIndex--;
    }
    
    if (state.searchCurrentIndex === -1 && direction === 'next') state.searchCurrentIndex = 0;

    if (state.searchCurrentIndex >= 0 && state.searchCurrentIndex < state.filteredLearnQuestions.length) {
        if (state.searchCurrentIndex >= state.learnRenderLimit) {
            state.learnRenderLimit = state.searchCurrentIndex + 5;
            renderLearnList();
            setTimeout(scrollToCurrentMatch, 50);
        } else {
            const currentQ = state.filteredLearnQuestions[state.searchCurrentIndex];
            const el = document.getElementById(`learn-q-${currentQ.id}`);
            if(el) el.classList.add('active-search-result');
            scrollToCurrentMatch();
        }
    }
}

function scrollToCurrentMatch() {
    if(state.searchCurrentIndex < 0 || !state.filteredLearnQuestions[state.searchCurrentIndex]) return;
    const id = `learn-q-${state.filteredLearnQuestions[state.searchCurrentIndex].id}`;
    const el = document.getElementById(id);
    if (el) { el.classList.add('active-search-result'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

function highlightText(text, query) {
    if (!query || !query.trim()) return text;
    const words = query.trim().split(/\s+/).filter(w => w.length > 0);
    let highlighted = text;
    words.forEach(w => {
        const escaped = escapeRegExp(w);
        const regex = new RegExp(`(${escaped})`, 'gi');
        highlighted = highlighted.replace(regex, '<mark>$1</mark>');
    });
    return highlighted;
}

function renderLearnList() {
    const container = document.getElementById('learn-list-container'); if (!container) return;
    const visibleItems = state.filteredLearnQuestions.slice(0, state.learnRenderLimit);
    
    if (visibleItems.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 font-medium text-sm">Ничего не найдено</div>`;
        return;
    }

    const html = visibleItems.map((q, idx) => {
        const isActive = idx === state.searchCurrentIndex;
        const qHtml = state.searchQuery ? highlightText(q.question, state.searchQuery) : q.question;
        return `
        <div id="learn-q-${q.id}" class="border border-black dark:border-slate-700 rounded-2xl overflow-hidden bg-white dark:bg-black shadow-sm mb-4 ${isActive ? 'active-search-result' : ''}">
            <div class="bg-slate-100 dark:bg-slate-900 border-b border-black dark:border-slate-700 p-2 flex justify-between gap-4 px-4">
                <span class="font-bold text-black dark:text-slate-300 text-[10px] tracking-widest uppercase flex-1 truncate">${q.topic}</span>
                <span class="font-bold text-slate-500 dark:text-slate-400 text-[10px] shrink-0">Задание №${q.id}</span>
            </div>
            <div class="p-3 border-b border-black dark:border-slate-800 bg-white dark:bg-black">
                <div class="font-bold text-black dark:text-white leading-snug text-sm">${qHtml}</div>
            </div>
            <div class="divide-y divide-black dark:divide-slate-800">
                ${q.options.map((opt, i) => {
                    if(!opt||!opt.trim())return'';
                    const cleanOpt = opt.replace(/^[\d]+[).]\s*/, '');
                    const optHtml = state.searchQuery ? highlightText(cleanOpt, state.searchQuery) : cleanOpt;
                    const isC = q.correctIndices.includes(i); 
                    let bgClass = "bg-white dark:bg-black text-black dark:text-slate-300";
                    if(isC) bgClass += " correct-answer";
                    return `<div class="flex"><div class="w-8 flex-shrink-0 flex items-center justify-center border-r border-black dark:border-slate-800 text-xs font-bold ${bgClass}">${i+1})</div><div class="flex-1 p-2.5 text-xs font-medium ${bgClass}">${optHtml}</div></div>`;
                }).join('')}
            </div>
        </div>`;
    }).join('');

    container.innerHTML = html + '<div id="learn-sentinel" class="h-10 w-full"></div>';
    
    if (learnObserver) learnObserver.disconnect();
    const sentinel = document.getElementById('learn-sentinel');
    if (sentinel) {
        learnObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                if (state.learnRenderLimit < state.filteredLearnQuestions.length) {
                    state.learnRenderLimit += 25;
                    renderLearnList(); 
                }
            }
        }, { rootMargin: '200px' });
        learnObserver.observe(sentinel);
    }
}

function render() {
    const app=document.getElementById('app');
    let scrollTop=0; const cd=document.querySelector('.layout-content');
    if(cd && app.dataset.view===state.view) scrollTop=cd.scrollTop;
    app.dataset.view=state.view;

    let bodyHTML='', footerHTML='';
    if(state.view==='menu') bodyHTML=renderMenuContent();
    else if(state.view==='learn') bodyHTML=renderLearnContent();
    else if(state.view==='quiz'||state.view==='mistakes') { bodyHTML=renderQuizContent(); footerHTML=renderQuizFooter(); }
    else if(state.view==='cards') { bodyHTML=renderCardsContent(); footerHTML=renderCardsFooter(); }
    
    app.innerHTML = `${renderHeader()}<div class="layout-content bg-slate-50 dark:bg-black">${bodyHTML}</div>${footerHTML}${state.showFilterModal?renderFilterModal():''}${state.showResetModal?renderResetModal():''}${state.showConfirmResetDialog?renderConfirmResetDialog():''}`;
    
    if(state.view==='cards') setTimeout(initCardEvents,0);
    if(state.showFilterModal) setTimeout(initFilterSwipeEvents, 0);
    
    if (state.view === 'learn') {
        renderLearnList();
        updateSearchUI(); 
        const container = document.getElementById('learn-list-container');
        if (state.hideAnswersInLearn && container) container.classList.add('hide-answers');
    }
    
    if(cd && scrollTop>0 && !state.searchQuery) document.querySelector('.layout-content').scrollTop=scrollTop;
    lucide.createIcons();
}

            <a href="https://t.me/stewonly" target="_blank" class="p-2 text-slate-500 hover:text-[#2AABEE] dark:text-slate-400 dark:hover:text-[#2AABEE] btn-click"><i data-lucide="send" class="w-5 h-5"></i></a>

function initFilterSwipeEvents() {
    const modalContent = document.getElementById('filter-modal-content');
    const topicsList = document.getElementById('topics-list');
    if(!modalContent || !topicsList) return;

    let startY = 0; let currentY = 0; let isDragging = false; let isScrollAtTop = true;

    modalContent.addEventListener('touchstart', (e) => {
        if(topicsList.scrollTop > 0) { isScrollAtTop = false; return; }
        isScrollAtTop = true; startY = e.touches[0].clientY; isDragging = true; modalContent.style.transition = 'none';
    }, {passive: true});

    modalContent.addEventListener('touchmove', (e) => {
        if(!isDragging) return;
        currentY = e.touches[0].clientY;
        const diff = currentY - startY;
        if(diff > 0 && isScrollAtTop) {
            if(e.cancelable) e.preventDefault();
            modalContent.style.transform = `translateY(${diff}px)`;
        }
    }, {passive: false});

    modalContent.addEventListener('touchend', () => {
        if(!isDragging) return;
        isDragging = false;
        const diff = currentY - startY;
        modalContent.style.transition = 'transform 0.3s ease-out';
        if(diff > 120 && isScrollAtTop) {
            modalContent.style.transform = `translateY(100%)`;
            setTimeout(() => toggleFilterModal(false), 200);
        } else {
            modalContent.style.transform = '';
        }
    });
}

function renderFilterModal() {
    if(!state.showFilterModal) return '';
    const allSel=state.selectedTopics.length===availableTopics.length;

    const stats = {};
    QUESTIONS_DATA.forEach(q => {
        if (!stats[q.topic]) stats[q.topic] = { total: 0, correct: 0 };
        stats[q.topic].total++;
        if (state.userProgress && state.userProgress[q.id]?.status === 'correct') stats[q.topic].correct++;
    });

    const shuffleBg = state.isShuffleEnabled ? 'bg-indigo-500' : 'bg-slate-300 dark:bg-slate-600';
    const shuffleKnob = state.isShuffleEnabled ? 'left-7' : 'left-1';
    
    const btnBase = "flex-1 flex items-center justify-between px-3 py-2 rounded-xl btn-click border transition-colors";
    const shuffleBtnClass = state.isShuffleEnabled 
        ? `${btnBase} bg-indigo-50 dark:bg-indigo-900/20 border-indigo-200 dark:border-indigo-800`
        : `${btnBase} bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700`;

    return `<div class="absolute inset-0 z-[60] flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm" onclick="if(event.target===this) toggleFilterModal(false)">
        <div id="filter-modal-content" class="bg-white dark:bg-slate-900 w-full sm:w-[400px] sm:rounded-3xl rounded-t-3xl p-6 shadow-2xl flex flex-col h-[85vh] mb-0 sm:mb-4 animate-slide-up">

            <div class="flex gap-2 mb-2 shrink-0">
                <div onclick="toggleShuffle()" class="${shuffleBtnClass}">
                    <div class="flex items-center gap-2">
                        <i data-lucide="shuffle" class="w-4 h-4 ${state.isShuffleEnabled ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-500'}"></i>
                        <span class="text-xs font-bold ${state.isShuffleEnabled ? 'text-indigo-700 dark:text-indigo-300' : 'text-slate-600 dark:text-slate-300'}">Случайный</span>
                    </div>
                    <div id="shuffle-toggle-bg" class="w-12 h-6 rounded-full relative transition-colors ${shuffleBg} scale-75 origin-right"><div id="shuffle-toggle-knob" class="w-4 h-4 bg-white rounded-full absolute top-1 transition-all ${shuffleKnob}"></div></div>
                </div>

                <button id="select-all-btn" onclick="toggleSelectAllTopics()" class="flex-1 flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors btn-click"><span>${allSel?'Снять все':'Выбрать все'}</span><i data-lucide="${allSel?'trash-2':'layers'}" class="w-4 h-4"></i></button>
            </div>

            <div id="topics-list" class="flex-1 overflow-y-auto space-y-2 mb-4 pr-1">
                ${availableTopics.map(t=>{
                    const sel = state.selectedTopics.includes(t);
                    const { total, correct } = stats[t] || { total: 0, correct: 0 };
                    const progress = total > 0 ? Math.round((correct / total) * 100) : 0;
                    let barBg = sel ? 'bg-white/20 dark:bg-black/20' : 'bg-slate-200 dark:bg-slate-700';
                    let fillBg = sel ? 'bg-emerald-400 dark:bg-emerald-600' : 'bg-emerald-500';
                    let txtColor = sel ? 'text-white/60 dark:text-black/60' : 'text-slate-400';
                    let progressHtml = `<div class="w-full h-1.5 ${barBg} rounded-full mt-2 overflow-hidden"><div class="h-full ${fillBg} rounded-full" style="width: ${progress}%"></div></div><div class="text-[10px] ${txtColor} mt-1 flex justify-between"><span>Прогресс (${correct}/${total})</span><span>${progress}%</span></div>`;

                    let btnClass = "w-full text-left px-4 py-3 rounded-xl font-bold text-sm flex flex-col gap-1 group btn-click relative";
                    let iconHtml = '';
                    if(sel) { btnClass += " bg-black text-white dark:bg-white dark:text-black border border-transparent"; iconHtml='<i data-lucide="check-circle" class="w-4 h-4 absolute top-3 right-3 text-emerald-400 dark:text-emerald-600"></i>'; } 
                    else { btnClass += " bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 relative"; }
                    
                    return `<button data-topic="${t}" onclick="toggleTopic('${t}')" class="${btnClass}"><div class="topic-content w-full"><span class="block text-wrap leading-tight pr-6 mb-1">${t}</span> ${progressHtml}</div><div class="icon-area">${iconHtml}</div></button>`
                }).join('')}
            </div>
            <button id="apply-btn" onclick="toggleFilterModal(false)" class="w-full py-4 bg-black dark:bg-white text-white dark:text-black rounded-2xl font-bold text-lg shrink-0 btn-click">Применить (${state.selectedTopics.length})</button>
        </div>
    </div>`;
}

function renderResetModal() {
    if(!state.showResetModal) return '';
    const allSel=state.resetSelectedTopics.length===availableTopics.length;
    return `<div class="absolute inset-0 z-[60] flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm" onclick="if(event.target===this) toggleResetModal(false)">
        <div class="bg-white dark:bg-slate-900 w-full sm:w-[400px] sm:rounded-3xl rounded-t-3xl p-6 shadow-2xl flex flex-col h-[85vh] mb-0 sm:mb-4 animate-slide-up">
            <div class="flex justify-between items-center mb-4 shrink-0"><h3 class="text-xl font-bold text-slate-900 dark:text-white">Сброс прогресса</h3><button onclick="toggleResetModal(false)" class="p-2 bg-slate-100 dark:bg-slate-800 rounded-full text-slate-500 btn-click"><i data-lucide="x" class="w-5 h-5"></i></button></div>
            <div id="reset-topics-list" class="flex-1 overflow-y-auto space-y-2 mb-4 pr-1">
                <button id="reset-select-all-btn" onclick="toggleSelectAllReset()" class="w-full text-left px-4 py-3 rounded-xl font-bold text-sm bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors flex justify-between items-center btn-click"><span>${allSel?'Снять все':'Выбрать все'}</span><i data-lucide="${allSel?'trash-2':'layers'}" class="w-4 h-4"></i></button>
                ${availableTopics.map(t=>{return`<button data-topic="${t}" onclick="toggleResetTopic('${t}')" class="w-full text-left px-4 py-3 rounded-xl font-bold text-sm flex flex-col gap-1 group btn-click bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 relative"><div class="topic-content w-full"><span class="block text-wrap leading-tight pr-6 mb-1">${t}</span></div><div class="icon-area"></div></button>`}).join('')}
            </div>
            <button id="confirm-reset-btn" onclick="confirmReset()" class="w-full py-4 bg-rose-500 text-white rounded-2xl font-bold text-lg shrink-0 btn-click shadow-lg shadow-rose-500/30">Сбросить</button>
        </div>
    </div>`;
}

function renderConfirmResetDialog() {
    return `<div class="absolute inset-0 z-[70] flex items-center justify-center bg-black/80 backdrop-blur-sm p-6 animate-fade-in">
        <div class="bg-white dark:bg-slate-900 w-full max-w-xs rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center animate-slide-up">
            <div class="w-16 h-16 bg-rose-100 dark:bg-rose-900/30 rounded-full flex items-center justify-center mb-4">
                <i data-lucide="alert-triangle" class="w-8 h-8 text-rose-500"></i>
            </div>
            <h3 class="text-xl font-black text-slate-900 dark:text-white mb-2">Вы уверены?</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6 font-medium leading-relaxed">
                Вы собираетесь сбросить прогресс для <span class="text-slate-900 dark:text-white font-bold">${state.resetSelectedTopics.length} тем</span>. 
            </p>
            <div class="flex flex-col gap-3 w-full">
                <button onclick="executeFinalReset()" class="w-full py-3 bg-rose-500 text-white rounded-xl font-bold shadow-lg shadow-rose-500/30 active:scale-95 transition-transform btn-click">Сбросить</button>
                <button onclick="cancelReset()" class="w-full py-3 bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-white rounded-xl font-bold active:scale-95 transition-transform btn-click">Отмена</button>
            </div>
        </div>
    </div>`;
}

function initCardEvents() {
    const card = document.getElementById('flashcard'); if (!card) return;
    let startX = 0; let startY = 0; let isSwiping = false; let isScrolling = false;
    card.style.transform = 'translateX(0px) rotate(0deg)'; card.style.transition = 'transform 0.3s ease-out';
    card.ontouchstart = (e) => { if (state.animState !== 'idle') return; startX = e.touches[0].clientX; startY = e.touches[0].clientY; isSwiping = false; isScrolling = false; card.style.transition = 'none'; };
    card.ontouchmove = (e) => {
        if (state.animState !== 'idle') return; if (isScrolling) return;
        const diffX = e.touches[0].clientX - startX; const diffY = e.touches[0].clientY - startY;
        if (Math.abs(diffY) > Math.abs(diffX)) { isScrolling = true; return; }
        if (Math.abs(diffX) > 10) { isSwiping = true; if(e.cancelable) e.preventDefault(); state.swipeX = diffX; card.style.transform = `translateX(${diffX}px) rotate(${diffX * 0.05}deg)`; }
    };
    card.ontouchend = () => {
        if (state.animState !== 'idle') return;
        if (isSwiping) { if (Math.abs(state.swipeX) > 100) animateCard(state.swipeX > 0 ? 'prev' : 'next'); else { card.style.transition = 'transform 0.3s ease-out'; card.style.transform = 'translateX(0px) rotate(0deg)'; } }
    };
}

function handleCardClick() { if (state.animState === 'idle') toggleFlip(); }

function animateCard(dir) {
    const card = document.getElementById('flashcard');
    if ((dir === 'next' && state.currentQuestionIndex >= state.playableQuestions.length - 1) || (dir === 'prev' && state.currentQuestionIndex <= 0)) { card.style.transition = 'transform 0.3s ease-out'; card.style.transform = 'translateX(0) rotate(0deg)'; return; }
    state.animState = 'animating'; card.style.transition = 'transform 0.2s ease-in, opacity 0.2s ease-in';
    card.style.transform = dir === 'next' ? 'translateX(-120vw) rotate(-20deg)' : 'translateX(120vw) rotate(20deg)'; card.style.opacity = '0';
    setTimeout(() => {
        if (dir === 'next') state.currentQuestionIndex++; else state.currentQuestionIndex--;
        state.isFlipped = false; state.swipeX = 0; render(); 
        const newCard = document.getElementById('flashcard'); newCard.style.transition = 'none';
        newCard.style.transform = dir === 'next' ? 'translateX(120vw) rotate(20deg)' : 'translateX(-120vw) rotate(-20deg)'; newCard.style.opacity = '0';
        requestAnimationFrame(() => { newCard.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out'; newCard.style.transform = 'translateX(0) rotate(0deg)'; newCard.style.opacity = '1'; setTimeout(() => { state.animState = 'idle'; }, 300); });
    }, 200);
}
function toggleFlip() { haptic('light'); state.isFlipped = !state.isFlipped; const inner = document.getElementById('card-inner'); if (inner) { if (state.isFlipped) inner.classList.add('rotate-y-180'); else inner.classList.remove('rotate-y-180'); } }

// --- ЗАПУСК ПРИЛОЖЕНИЯ ---
if (USE_AUTH) {
    videoFinished = true;
    document.getElementById('auth-screen').classList.remove('hidden-force');
    document.getElementById('app').classList.add('hidden-force');
    performAccessCheck();
} else {
    loadLocalFallback();
    processQuestions();
    initApp();
}
</script>
</body>
</html>
